[package]
name = "dzul-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["Dzulkifli Anwar"]
description = "Zero-allocation, no_std compatible TSP solver using GET-NFI algorithm."

[features]
default = []
std = []
parallel = ["std", "dep:rayon"]

[dependencies]
libm = "0.2.16"
rayon = { version = "1.12.0", optional = true }



