[workspace]
members = ["crates/dzul-core", "crates/dzul-bench"]
resolver = "2"

[profile.dev]
opt-level = 1
debug = true
codegen-units = 16
incremental = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 16

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"


